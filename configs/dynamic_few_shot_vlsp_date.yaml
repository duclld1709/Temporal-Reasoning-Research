experiment_name: dynamic_few_shot_vlsp_date_k3
method: dynamic_few_shot
dataset: vlsp_date
seed: 42
model_name: Qwen/Qwen3-8B
dtype: bfloat16
enable_thinking: false
k_shot: 3
max_samples: default
output_dir: outputs
progress_every: 50
# Dynamic retrieval settings
encoder_name: intfloat/multilingual-e5-base
text_scope: context_question
pool_exclude_first_n: 1500
retrieval_cache_dir: outputs/retrieval_cache
balance_by_label: false
unique_by_qid: false
